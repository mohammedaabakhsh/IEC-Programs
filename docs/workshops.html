<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#214c2b">
<title>الورش والبرامج — مركز الابتكار وريادة الأعمال</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/mobile.css">
<link rel="stylesheet" href="assets/professional.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">IEC</div><div><strong>مركز الابتكار</strong><span>وريادة الأعمال</span></div></div>
    <div class="sidebar-search"><input type="text" id="quickSearchInput" placeholder="بحث سريع..." autocomplete="off"><div id="quickSearchResults"></div></div>
    <nav class="nav-list">
      <a href="index.html" class="nav-item"><span class="ic">⌂</span> لوحة التحكم</a>
      <a href="workshops.html" class="nav-item active"><span class="ic">▣</span> الورش والبرامج</a>
      <a href="reports.html" class="nav-item"><span class="ic">◔</span> التقارير والتحليلات</a>
      <a href="certificate.html" class="nav-item"><span class="ic">◇</span> الشهادات</a>
      <a href="settings.html" class="nav-item"><span class="ic">⚙</span> الإعدادات</a>
    </nav>
    <div class="sidebar-foot">نظام إدارة برامج وورش<br>مركز الابتكار وريادة الأعمال</div>
  </aside>
  <main class="main-content">
    <header class="app-header"><h1>الورش والبرامج</h1><p>إضافة الأنشطة والبحث والفلترة ومتابعة التقييمات</p></header>
    <div class="page-content">
      <div class="toolbar"><div><strong>إدارة الأنشطة</strong><div id="statusMsg" style="font-size:12px;color:var(--muted);margin-top:3px;"></div></div><button class="btn" id="addBtn">إضافة ورشة جديدة</button></div>
      <div class="card filter-card">
        <div style="display:grid;grid-template-columns:minmax(200px,2fr) repeat(3,minmax(110px,1fr)) auto;gap:10px;align-items:end;">
          <div><label>بحث بالاسم أو المدرب أو الجهة</label><input type="text" id="filterSearch" placeholder="اكتب للبحث..."></div>
          <div><label>النوع</label><select id="filterType"><option value="">الكل</option></select></div>
          <div><label>السنة</label><select id="filterYear"><option value="">الكل</option></select></div>
          <div><label>الشهر</label><select id="filterMonth"><option value="">الكل</option></select></div>
          <button class="btn secondary" id="clearFiltersBtn" type="button">مسح</button>
        </div>
      </div>
      <div id="listContainer"><div class="skeleton-grid"><div class="skeleton-card"><span></span><span></span><span></span></div><div class="skeleton-card"><span></span><span></span><span></span></div><div class="skeleton-card"><span></span><span></span><span></span></div></div></div>
    </div>
    <footer>مركز الابتكار وريادة الأعمال</footer>
  </main>
</div>
<div class="modal-overlay" id="modalOverlay"><div class="modal"><div class="modal-header"><h3>إضافة ورشة جديدة</h3><button class="icon-btn" id="closeModal">✕</button></div><div id="modalBody"><form id="addForm">
  <div class="form-row"><label>اسم الورشة</label><input type="text" id="f_name" required></div>
  <div class="form-row"><label>نوع النشاط</label><select id="f_type" required><option value="">اختر النوع</option><option>ورشة عمل</option><option>برنامج</option><option>جلسة</option></select></div>
  <div class="form-row"><label>وصف البرنامج</label><textarea id="f_description" rows="3"></textarea></div>
  <div class="form-row two-col"><div><label>التاريخ</label><input type="date" id="f_date" required></div><div><label>الوقت</label><input type="time" id="f_time" required></div></div>
  <div class="form-row"><label>المدرب / مقدم الجلسة</label><input type="text" id="f_trainer" required></div>
  <div class="form-row"><label>الفئة المستهدفة</label><select id="f_audience" required><option value="">اختر الفئة</option></select></div>
  <div class="form-row two-col"><div><label>عدد المشاركين</label><input type="number" id="f_participants" min="1" required></div><div><label>الجهة المنظمة</label><input type="text" id="f_organizer" required></div></div>
  <div id="addFormError" class="error-state" style="display:none;"></div><button type="submit" class="btn" style="width:100%;">حفظ وإنشاء رابط التقييم</button>
</form></div></div></div>
<script src="assets/config.js"></script>
<script src="assets/ui-core.js"></script>
<script src="assets/app.js"></script>
<script src="assets/quicksearch.js"></script>
</body>
</html>
